<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата сделки №{{ deal.id }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            padding: 20px 12px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

            .header h1 {
                font-size: 20px;
                color: #111;
                margin-bottom: 6px;
            }

            .header p {
                font-size: 14px;
                color: #666;
            }

        .amount-box {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .amount-title {
            font-size: 13px;
            color: #707579;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .amount-value {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin-top: 4px;
        }

        .qr-section {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 16px;
        }

            .qr-section img {
                width: 180px;
                height: 180px;
                border-radius: 8px;
            }

        .qr-hint {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
            line-height: 1.4;
        }

        .phone-box {
            background: #eef5ff;
            border: 1px dashed #007bff;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .phone-label {
            font-size: 12px;
            color: #0056b3;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .phone-number {
            font-size: 18px;
            font-weight: 700;
            color: #004085;
            letter-spacing: 0.5px;
        }

        .btn-copy {
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            width: 100%;
        }

            .btn-copy:active {
                opacity: 0.8;
            }

        .banks-title {
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 12px;
        }

        .bank-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.1s;
        }

            .bank-btn:active {
                transform: scale(0.98);
            }

        /* Стили кнопок банков без встроенного Jinja2 */
        .bank-sber {
            background-color: #21a038;
            color: #ffffff;
        }

        .bank-tbank {
            background-color: #ffdd2d;
            color: #000000;
        }

        .bank-alfa {
            background-color: #ef3124;
            color: #ffffff;
        }

        .bank-vtb {
            background-color: #002882;
            color: #ffffff;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 13px;
            display: none;
            z-index: 100;
            text-align: center;
            width: 90%;
            max-width: 360px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Сделка №{{ deal.id }}</h1>
            <p>{{ deal.subject }}</p>
        </div>

        <div class="amount-box">
            <div class="amount-title">К оплате (СБП)</div>
            <div class="amount-value">{{ "%.2f"|format(pay_amount) }} ₽</div>
        </div>

        <div class="phone-box">
            <div class="phone-label">Номер для перевода по СБП</div>
            <div class="phone-number" id="phoneNumber">{{ phone_display }}</div>
            <button class="btn-copy" onclick="copyPhone()">📋 Скопировать номер</button>
        </div>

        <div class="qr-section">
            <img src="data:image/png;base64,{{ qr_code_base64 }}" alt="QR Code">
            <div class="qr-hint">
                📷 <strong>Сканируйте обычной камерой телефона</strong>,<br>чтобы открыть эту страницу оплаты на смартфоне.
            </div>
        </div>

        <div class="banks-title">Оплатить в приложении банка:</div>

        <button class="bank-btn bank-sber" onclick="openBank('{{ bank_links.sber.deeplink }}', '{{ bank_links.sber.web_fallback }}')">
            🟢 СберБанк
        </button>

        <button class="bank-btn bank-tbank" onclick="openBank('{{ bank_links.tbank.deeplink }}', '{{ bank_links.tbank.web_fallback }}')">
            🟡 Т-Банк (Тинькофф)
        </button>

        <button class="bank-btn bank-alfa" onclick="openBank('{{ bank_links.alfa.deeplink }}', '{{ bank_links.alfa.web_fallback }}')">
            🔴 Альфа-Банк
        </button>

        <button class="bank-btn bank-vtb" onclick="openBank('{{ bank_links.vtb.deeplink }}', '{{ bank_links.vtb.web_fallback }}')">
            🔵 ВТБ
        </button>
    </div>

    <div id="toast" class="toast"></div>

    <script>
    const cleanPhone = "{{ clean_phone }}";

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function copyPhone() {
        navigator.clipboard.writeText(cleanPhone).then(() => {
            showToast('✅ Номер ' + cleanPhone + ' скопирован! Вставьте его при переводе по СБП.');
        }).catch(() => {
            showToast('Номер: ' + cleanPhone);
        });
    }

    function openBank(deeplink, fallback) {
        copyPhone();
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile) {
            window.location.href = deeplink;
            setTimeout(() => {
                window.location.href = fallback;
            }, 1500);
        } else {
            showToast('📱 Номер скопирован! Откройте приложение банка на телефоне и переведите по СБП.');
        }
    }
    </script>

</body>
</html>
